name: Renovate

on:
  # Every two hours, so at least two runs land in each 20:00 to midnight
  # (London time) window that renovate.json5 schedules updates in.
  schedule:
    - cron: "30 */2 * * *"
  # Ticking a box on the Dependency Dashboard issue.
  issues:
    types: [edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate

jobs:
  renovate:
    name: Renovate
    # Renovate unticks the dashboard boxes when it runs, so only an edit that
    # ticks one starts a run.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Dependency Dashboard' &&
      github.event.issue.user.login == 'edmundhung' &&
      contains(github.event.issue.body, '- [x] '))
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          # A fine-grained token from edmundhung, so pushes and pull requests
          # trigger CI, which they would not with GITHUB_TOKEN.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}

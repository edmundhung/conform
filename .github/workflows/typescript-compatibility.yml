name: TypeScript Compatibility

on:
  push:
    branches: [main, next]
    paths:
      - '.github/workflows/typescript-compatibility.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'examples/**'
  pull_request:
    branches: [main, next]
    paths:
      - '.github/workflows/typescript-compatibility.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'examples/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      typescript:
        description: 'TypeScript version, range, or tag'
        required: false
        default: '7'
        type: string

permissions:
  contents: read

jobs:
  resolve-typescript:
    name: Resolve TypeScript
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    env:
      TYPESCRIPT_SPEC: ${{ inputs.typescript || '7' }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve exact version
        id: resolve
        run: |
          versions="$(npm view "typescript@$TYPESCRIPT_SPEC" version --json)"
          version="$(jq -er 'if type == "array" then last else . end' <<< "$versions")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'Requested `%s`; resolved `%s`.\n' "$TYPESCRIPT_SPEC" "$version" >> "$GITHUB_STEP_SUMMARY"

  example-types:
    name: Examples — TS ${{ needs.resolve-typescript.outputs.version }}
    needs: resolve-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: |
          npm i -g corepack@latest
          corepack enable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Generate framework types
        run: |
          pnpm --filter nextjs-example exec next typegen
          pnpm --filter react-router-example exec react-router typegen
      - name: Typecheck examples
        # @astrojs/check currently supports TypeScript 5 only, so Astro is omitted.
        run: |
          pnpm --package="typescript@${{ needs.resolve-typescript.outputs.version }}" dlx tsc \
            --build \
            examples/chakra-ui \
            examples/headless-ui \
            examples/material-ui \
            examples/nextjs \
            examples/radix-ui \
            examples/react-aria \
            examples/react-router \
            examples/react-spa \
            examples/shadcn-ui \
            --pretty false

name: Validate
on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Commit SHA / PR Number'
        type: string
        required: false
        default: ''
      typescript:
        description: 'JSON array of TypeScript versions, ranges, or tags (e.g. ["5.8", "7"])'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      preview:
        description: 'Commit SHA / PR Number'
        type: string
        required: false
        default: ''
      typescript:
        description: 'JSON array of TypeScript versions, ranges, or tags (e.g. ["5.8", "7"])'
        type: string
        required: false
        default: ''

jobs:
  examples:
    name: Examples
    if: inputs.preview != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Install pre-release
        env:
          PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: 'false'
        run: >
          pnpm --filter './examples/*' add
          https://pkg.pr.new/@conform-to/react@${{ inputs.preview }}
          https://pkg.pr.new/@conform-to/zod@${{ inputs.preview }}
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run tests
        run: pnpm --filter './examples/*' run --if-present test

  typecheck:
    name: Typecheck — TS ${{ matrix.typescript }}
    if: inputs.typescript != ''
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        typescript: ${{ fromJSON(inputs.typescript) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - name: Build packages
        if: inputs.preview == ''
        run: pnpm build
      - name: Install pre-release
        if: inputs.preview != ''
        env:
          PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: 'false'
        run: >
          pnpm --filter './examples/*' add
          https://pkg.pr.new/@conform-to/react@${{ inputs.preview }}
          https://pkg.pr.new/@conform-to/zod@${{ inputs.preview }}
      - name: Generate framework types
        run: |
          pnpm --filter nextjs-example exec next typegen
          pnpm --filter react-router-example exec react-router typegen
      - name: Typecheck examples
        # Astro supports TypeScript 5 only and the legacy Remix example will be removed.
        env:
          TYPESCRIPT_SPEC: ${{ matrix.typescript }}
        run: |
          pnpm --package="typescript@$TYPESCRIPT_SPEC" dlx tsc --version
          pnpm --package="typescript@$TYPESCRIPT_SPEC" dlx tsc \
            --build \
            examples/chakra-ui \
            examples/headless-ui \
            examples/material-ui \
            examples/nextjs \
            examples/radix-ui \
            examples/react-aria \
            examples/react-router \
            examples/react-spa \
            examples/shadcn-ui \
            --pretty false

  epicstack:
    name: Epic Stack
    if: inputs.preview != ''
    runs-on: ubuntu-22.04
    steps:
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap project
        run: SKIP_DEPLOYMENT=true npx epicli new ./

      - name: Install pre-release
        run: |
          npm i https://pkg.pr.new/@conform-to/react@${{ inputs.preview }} https://pkg.pr.new/@conform-to/zod@${{ inputs.preview }}

      - name: Copy test env vars
        run: cp .env.example .env

      - name: Setup Database
        run: npx prisma migrate deploy && npx prisma generate --sql

      - name: Cache Database
        id: db-cache
        uses: actions/cache@v4
        with:
          path: prisma/data.db
          key: db-cache-schema_${{ hashFiles('./prisma/schema.prisma')
            }}-migrations_${{ hashFiles('./prisma/migrations/*/migration.sql')
            }}

      - name: Seed Database
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: npx prisma migrate reset --force

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck --if-present

      - name: Run vitest
        run: npm run test -- --coverage

      - name: Playwright tests
        run: npx playwright test

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

name: Guide
on:
  push:
    branches: [main]
    paths:
      - 'guide/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/guide.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'docs/**'
      - 'guide/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/guide.yml'

permissions:
  contents: read

concurrency:
  group: guide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CF_SEND_TELEMETRY: 'false'

jobs:
  deploy:
    name: Deploy
    if: github.event.action != 'closed'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To comment the preview URL on the pull request
      pull-requests: write
    env:
      # Pull requests from forks and Dependabot have no access to secrets
      HAS_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: guide
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
      - name: Typecheck
        run: pnpm run typecheck
      - name: Deploy
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec cf deploy
      - name: Deploy preview
        if: github.event_name == 'pull_request' && env.HAS_DEPLOY_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec cf previews deploy "pr-$PR_NUMBER" > preview.json
      - name: Comment preview URL
        if: github.event_name == 'pull_request' && env.HAS_DEPLOY_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          --edit-last --create-if-none
          --body "Guide preview: $(jq -r '.preview_urls[0]' preview.json)"
      - name: Check build
        if: github.event_name == 'pull_request' && env.HAS_DEPLOY_TOKEN != 'true'
        run: pnpm exec cf deploy --dry-run

  cleanup:
    name: Delete preview
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guide
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
      - name: Delete preview
        # The preview may not exist, e.g. if the deploy token was not available
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec cf previews delete "pr-$PR_NUMBER" --worker conform-guide --force

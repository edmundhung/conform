name: Tests
on:
  push:
    branches: [main, next]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - 'guide/**'
  pull_request:
    branches: [main, next]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - 'guide/**'

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        browser: [webkit, firefox, chromium]
        node: [22]
        exclude:
          - os: macos-latest
            browser: firefox
          - os: windows-latest
            browser: firefox
          - os: windows-latest
            browser: webkit
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}
      - name: Upload report to GitHub Actions Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
  unit:
    name: API Tests (v1)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@22
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Vitest tests
        run: pnpm exec vitest --project=browser --project=node
  future:
    name: Future API Tests
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        browser: [webkit, firefox, chromium]
        node: [22]
        exclude:
          - os: macos-latest
            browser: firefox
          - os: windows-latest
            browser: firefox
          - os: windows-latest
            browser: webkit
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Vitest tests
        run: pnpm run test:future --browser.name=${{ matrix.browser }}
  typecheck:
    name: Typecheck
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@22
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Run Typecheck
        run: pnpm -r run typecheck

name: Tests
on:
  push:
    branches: [main, next]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - 'guide/**'
  pull_request:
    branches: [main, next]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - 'guide/**'

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        browser: [webkit, firefox, chromium]
        node: [22]
        exclude:
          - os: macos-latest
            browser: firefox
          - os: windows-latest
            browser: firefox
          - os: windows-latest
            browser: webkit
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}
      - name: Upload report to GitHub Actions Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
  unit:
    name: API Tests (v1)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@22
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Vitest tests
        run: pnpm exec vitest --project=browser --project=node
  future:
    name: Future API Tests
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        browser: [webkit, firefox, chromium]
        node: [22]
        exclude:
          - os: macos-latest
            browser: firefox
          - os: windows-latest
            browser: firefox
          - os: windows-latest
            browser: webkit
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Vitest tests
        run: pnpm run test:future --browser.name=${{ matrix.browser }}
  typecheck:
    name: Typecheck
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@22
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Run Typecheck
        run: pnpm -r run typecheck

name: Dependency updates

on:
  # GitHub blocks pull_request_target in public repositories from December 2,
  # 2026. Bot-triggered pull_request runs still get write access through each
  # job's `permissions`.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    # Renovate labels the updates that can merge on their own `automerge`. Only
    # run for events Renovate triggered on its own pull requests, so pushes or
    # labels from anyone else are skipped.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.user.login == github.actor &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      (github.event.action != 'labeled' || github.event.label.name == 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Approve the commit this run was triggered for, not whatever is newest.
        run: >-
          gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews"
          -f commit_id="$HEAD_SHA" -f event=APPROVE
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Fails if the branch has moved since this run started.
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

  retry-package-age:
    name: Retry package age failures
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Rerun blocked Renovate previews
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! pull_requests="$(
            gh pr list \
              --app renovate \
              --state open \
              --limit 100 \
              --json headRefOid,number \
              --jq '.[] | [.number, .headRefOid] | @tsv'
          )"; then
            echo "Unable to list open Renovate PRs" >&2
            exit 1
          fi
          if [[ -z "$pull_requests" ]]; then
            exit 0
          fi

          while IFS=$'\t' read -r number head_sha; do
            run_id="$(
              gh run list \
                --workflow preview.yml \
                --commit "$head_sha" \
                --event pull_request \
                --status failure \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -z "$run_id" ]]; then
              continue
            fi

            if ! failed_log="$(gh run view "$run_id" --log-failed)"; then
              echo "Unable to read failed logs for PR #$number"
              continue
            fi
            if [[ "$failed_log" != *ERR_PNPM_NO_MATURE_MATCHING_VERSION* ]]; then
              continue
            fi

            gh run rerun "$run_id" --failed
            echo "Rerunning Preview for PR #$number"
          done <<< "$pull_requests"

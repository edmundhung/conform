name: Dependency updates

on:
  pull_request:
    types: [auto_merge_enabled]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  approve:
    name: Approve auto-merging updates
    # Renovate turns on auto-merge for the updates that can merge on their own.
    # Approve those, but only when Renovate turned it on for its own pull
    # request.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'conform-renovate[bot]' &&
      github.event.pull_request.user.login == github.actor
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Approve the commit this run was triggered for, not whatever is newest.
        run: >-
          gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews"
          -f commit_id="$HEAD_SHA" -f event=APPROVE

  retry-package-age:
    name: Retry package age failures
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Rerun blocked Renovate previews
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! pull_requests="$(
            gh pr list \
              --app conform-renovate \
              --state open \
              --limit 100 \
              --json headRefOid,number \
              --jq '.[] | [.number, .headRefOid] | @tsv'
          )"; then
            echo "Unable to list open Renovate PRs" >&2
            exit 1
          fi
          if [[ -z "$pull_requests" ]]; then
            exit 0
          fi

          while IFS=$'\t' read -r number head_sha; do
            run_id="$(
              gh run list \
                --workflow preview.yml \
                --commit "$head_sha" \
                --event pull_request \
                --status failure \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -z "$run_id" ]]; then
              continue
            fi

            if ! failed_log="$(gh run view "$run_id" --log-failed)"; then
              echo "Unable to read failed logs for PR #$number"
              continue
            fi
            if [[ "$failed_log" != *ERR_PNPM_NO_MATURE_MATCHING_VERSION* ]]; then
              continue
            fi

            gh run rerun "$run_id" --failed
            echo "Rerunning Preview for PR #$number"
          done <<< "$pull_requests"

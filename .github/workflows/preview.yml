name: Preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          runtime: node@22
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Publish to pkg.pr.new
        run: pnpx pkg-pr-new publish --compact './packages/*' --template './examples/*'

  validate:
    name: Validate Preview
    needs: [release]
    uses: ./.github/workflows/validate.yml
    with:
      preview: ${{ github.event.pull_request.number || github.sha }}
      typescript: '["5.8", "7"]'

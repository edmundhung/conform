name: Preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - name: Build packages
        run: pnpm build
      - name: Publish to pkg.pr.new
        run: pnpx pkg-pr-new publish --compact './packages/*' --template './examples/*'

  validate:
    name: Validate Preview
    needs: [release]
    uses: ./.github/workflows/validate.yml
    with:
      preview: ${{ github.event.pull_request.number || github.sha }}
      typescript: '["5.8", "7"]'

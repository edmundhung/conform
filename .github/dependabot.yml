version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '20:00'
      timezone: Europe/London
    # pnpm's minimumReleaseAge does not cover actions, so wait here instead.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'

  # pnpm manages the root, packages, guide, playground, and every example as
  # one workspace with a shared lockfile, so Dependabot must run from the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '20:00'
      timezone: Europe/London
    # Dependabot passes this to pnpm as minimumReleaseAge, so transitive
    # packages are this old too. Keep it at or above the value in
    # pnpm-workspace.yaml. Security updates skip it.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    rebase-strategy: auto
    # Keep packages that must use the same version in one pull request.
    groups:
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/test'
      react:
        patterns:
          - 'react'
          - 'react-dom'
      react-router:
        patterns:
          - 'react-router'
          - '@react-router/dev'
          - '@react-router/node'
          - '@react-router/serve'
      tanstack:
        patterns:
          - '@tanstack/react-router'
          - '@tanstack/react-start'
          - '@tanstack/router-cli'
      remix:
        patterns:
          - '@remix-run/*'
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/vite'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/browser'
          - '@vitest/browser-playwright'
      # Batch every other minor and patch update into one pull request. It must
      # come after the groups above because Dependabot uses the first group that
      # matches. Major updates still open separately because they are not
      # auto-merged.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'

  # pnpm manages the root, packages, guide, playground, and every example as
  # one workspace with a shared lockfile, so Dependabot must run from the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '06:00'
      timezone: Europe/London
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    rebase-strategy: auto
    # Keep packages that must use the same version in one pull request.
    groups:
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/test'
      react:
        patterns:
          - 'react'
          - 'react-dom'
      react-router:
        patterns:
          - 'react-router'
          - '@react-router/dev'
          - '@react-router/node'
          - '@react-router/serve'
      remix:
        patterns:
          - '@remix-run/cloudflare'
          - '@remix-run/cloudflare-pages'
          - '@remix-run/dev'
          - '@remix-run/node'
          - '@remix-run/react'
          - '@remix-run/serve'
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/vite'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/browser'
          - '@vitest/browser-playwright'
    commit-message:
      prefix: 'chore(deps)'

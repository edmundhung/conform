version: 2

# Version updates come from Renovate (.github/renovate.json5). These entries only
# configure Dependabot security updates: `open-pull-requests-limit: 0` turns off
# version updates without affecting security updates.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(ci)'

  # pnpm manages the root, packages, guide, playground, and every example as
  # one workspace with a shared lockfile, so Dependabot must run from the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'

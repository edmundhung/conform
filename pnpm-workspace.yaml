packages:
  - 'packages/*'
  - 'examples/*'
  - 'guide'
  - 'playground'

minimumReleaseAge: 2880

allowBuilds:
  deasync: true
  esbuild: true
  msw: false
  sharp: true
  # Only downloads its native binary when optional dependencies are skipped.
  # create-next-app sets the same default for pnpm projects.
  unrs-resolver: false
  workerd: true

linkWorkspacePackages: true

hoistPattern:
  - '*'
  - '!@types/react'
  - '!@types/react-dom'
  - '!react'
  - '!react-dom'

syncInjectedDepsAfterScripts:
  - build

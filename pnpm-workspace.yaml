packages:
  - 'packages/*'
  - 'examples/*'
  - 'guide'
  - 'playground'

minimumReleaseAge: 2880

allowBuilds:
  deasync: true
  esbuild: true
  msw: false
  sharp: true
  # Needed by the Next.js example.
  unrs-resolver: false
  workerd: true

linkWorkspacePackages: true

hoistPattern:
  - '*'
  - '!@types/react'
  - '!@types/react-dom'
  - '!react'
  - '!react-dom'

syncInjectedDepsAfterScripts:
  - build
minimumReleaseAgeExclude:
  # Renovate security update: @babel/core@7.29.6
  - "@babel/core@7.29.6"
  # Renovate security update: astro@7.4.7
  - astro@7.4.7
  # Renovate security update: zod@4.6.6
  - zod@4.6.6

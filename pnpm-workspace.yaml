packages:
  - 'packages/*'
  - 'examples/*'
  - 'guide'
  - 'playground'

minimumReleaseAge: 2880

allowBuilds:
  deasync: true
  esbuild: true
  msw: false
  sharp: true
  # Needed by the Next.js example.
  unrs-resolver: false
  workerd: true

linkWorkspacePackages: true

hoistPattern:
  - '*'
  - '!@types/react'
  - '!@types/react-dom'
  - '!react'
  - '!react-dom'

syncInjectedDepsAfterScripts:
  - build
minimumReleaseAgeExclude:
  # Renovate security update: @remix-run/node@2.17.2
  - "@remix-run/node@2.17.2"
